name: generate snake

on:
  schedule:
    - cron: "0 */6 * * *"   # regenerate every 6 hours
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: yash936936
          outputs: |
            dist/snake.svg?color_snake=%23e60023&color_dots=%2333332e,%2362625b,%2391918c,%23c8c8c1,%23ffffff&color_dots_border=%23262622
            dist/snake-dark.svg?color_snake=%23e60023&color_dots=%2333332e,%2362625b,%2391918c,%23c8c8c1,%23ffffff&color_dots_border=%23262622

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
