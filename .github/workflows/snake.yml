name: generate snake

on:
  schedule:
    - cron: "0 */6 * * *"   # regenerate every 6 hours
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: yash936936
          outputs: |
            dist/snake.svg?color_snake=%23c31d3d&color_dots=%23141414,%233d3d3d,%237a7a7a,%23c9c9c9,%23faf1ef&color_dots_border=%2308080a
            dist/snake-dark.svg?color_snake=%23c31d3d&color_dots=%23141414,%233d3d3d,%237a7a7a,%23c9c9c9,%23faf1ef&color_dots_border=%2308080a

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
